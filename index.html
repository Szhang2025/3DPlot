<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Function Plotter 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,#0a0a0a,#1a1a2e);color:#00ff88;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,136,.03) 2px,rgba(0,255,136,.03) 4px),repeating-linear-gradient(90deg,transparent,transparent 2px,rgba(0,255,136,.03) 2px,rgba(0,255,136,.03) 4px);pointer-events:none;z-index:-1}
#canvas-container{width:100vw;height:100vh;position:relative;touch-action:none}
#control-panel{position:absolute;top:20px;left:20px;background:rgba(10,10,10,.95);border:3px solid #00ff88;padding:25px;width:380px;max-width:calc(100vw - 40px);max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 0 40px rgba(0,255,136,.3),inset 0 0 20px rgba(0,255,136,.05);backdrop-filter:blur(10px);z-index:100;transition:transform .3s ease}
#control-panel.collapsed{transform:translateX(-120%)}
#toggle-panel{position:absolute;top:20px;left:20px;width:50px;height:50px;background:rgba(10,10,10,.95);border:3px solid #00ff88;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:101;transition:left .3s ease;box-shadow:0 0 20px rgba(0,255,136,.3)}
#toggle-panel:hover{background:rgba(0,255,136,.1)}
#toggle-panel.panel-open{left:min(420px,calc(100vw - 70px))}
.toggle-icon{color:#00ff88;font-size:24px;font-weight:bold;user-select:none}
h1{font-family:'Orbitron',sans-serif;font-size:28px;margin-bottom:8px;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,#00ff88,#00ffff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 5px rgba(0,255,136,.5))}to{filter:drop-shadow(0 0 15px rgba(0,255,136,.8))}}
.subtitle{font-size:11px;color:#00ff8888;margin-bottom:20px;letter-spacing:1px}
label{display:block;margin-bottom:8px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#00ffaa}
input[type=text],select{width:100%;padding:12px;margin-bottom:18px;background:rgba(0,20,10,.8);border:2px solid #00ff88;color:#00ff88;font-family:inherit;font-size:14px;outline:none;transition:all .3s ease}
input[type=text]:focus,select:focus{border-color:#00ffff;box-shadow:0 0 20px rgba(0,255,255,.3)}
select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%2300ff88' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:35px}
#plot-btn{width:100%;padding:14px;background:linear-gradient(135deg,#00ff88,#00cc88);border:none;color:#000;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:2px;transition:all .3s ease}
#plot-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,255,136,.4)}
#plot-btn:active{transform:none}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.preset-btn{padding:8px;font-family:inherit;font-size:11px;background:rgba(0,255,136,.1);border:1px solid #00ff88;color:#00ff88;cursor:pointer;transition:all .2s ease}
.preset-btn:hover{background:rgba(0,255,136,.2);transform:translateY(-1px)}
.divider{height:2px;background:linear-gradient(90deg,transparent,#00ff88,transparent);margin:20px 0}
.error{color:#ff0066;font-size:12px;margin:-12px 0 12px;display:none}
.error.show{display:block;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#range{font-size:12px;color:#00ff88aa;margin-top:14px}
#info{position:absolute;bottom:20px;right:20px;background:rgba(10,10,10,.9);border:2px solid #00ff8844;padding:15px;font-size:12px;color:#00ff88aa;max-width:300px;line-height:1.6}
@media (max-width:700px){#info{display:none}}
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="toggle-panel" class="panel-open"><div class="toggle-icon">✕</div></div>

<div id="control-panel">
  <h1>Function³</h1>
  <div class="subtitle">3D Mathematical Visualizer</div>
  <label for="function-input">Function z = f(x, y)</label>
  <input type="text" id="function-input" value="sin(sqrt(x*x + y*y))" autocomplete="off" spellcheck="false">
  <div class="error" id="error-msg">Invalid function syntax</div>
  <label for="color-scheme">Color Scheme</label>
  <select id="color-scheme">
    <option value="rainbow">Rainbow</option>
    <option value="plasma">Plasma</option>
    <option value="viridis">Viridis</option>
    <option value="cool">Cool</option>
    <option value="hot">Hot</option>
  </select>
  <button id="plot-btn">Generate Plot</button>
  <div id="range"></div>
  <div class="divider"></div>
  <label>Quick Examples</label>
  <div class="presets">
    <button class="preset-btn" data-func="sin(x) * cos(y)">Wave</button>
    <button class="preset-btn" data-func="sin(sqrt(x*x + y*y))">Ripple</button>
    <button class="preset-btn" data-func="x*x - y*y">Saddle</button>
    <button class="preset-btn" data-func="sin(x) + sin(y)">Grid</button>
    <button class="preset-btn" data-func="exp(-0.1*(x*x + y*y)) * cos(x) * cos(y)">Gaussian</button>
    <button class="preset-btn" data-func="abs(sin(x*y/5))">Bumps</button>
  </div>
</div>

<div id="info">
  <strong>CONTROLS:</strong><br>
  🖱️ Drag to rotate<br>
  🔍 Scroll to zoom<br>
  ⌨️ Math functions: sin, cos, tan, sqrt, abs, exp, log, pow…<br>
  ^ works as a power (use (-x)^2 for a negative base)
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.Fog(0x0a0a0a, 40, 90);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.getElementById('canvas-container').appendChild(renderer.domElement);

// White lights so colormap colors stay true
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl1 = new THREE.DirectionalLight(0xffffff, 0.7); dl1.position.set(10, 20, 10); scene.add(dl1);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.4); dl2.position.set(-10, 10, -10); scene.add(dl2);

// Colormaps (interpolated stops)
function ramp(stops) {
  return t => {
    const p = Math.max(0, Math.min(1, t)) * (stops.length - 1);
    const i = Math.min(Math.floor(p), stops.length - 2), f = p - i;
    const a = stops[i], b = stops[i + 1];
    return new THREE.Color(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f);
  };
}
const colorSchemes = {
  rainbow: t => new THREE.Color().setHSL((1 - t) * 0.7, 1, 0.5),
  plasma: ramp([[.050,.030,.528],[.494,.012,.658],[.798,.280,.470],[.973,.585,.254],[.940,.975,.131]]),
  viridis: ramp([[.267,.005,.329],[.231,.322,.546],[.128,.567,.551],[.370,.789,.383],[.993,.906,.144]]),
  cool: t => new THREE.Color(t, 1 - t, 1),
  hot: ramp([[0,0,0],[.9,0,0],[1,.7,0],[1,1,.6],[1,1,1]])
};

let surface = null, wire = null, scaleTimer = null;
const HALF = 10, SEG = 100, BOX = 10;

function buildFunction(src) {
  const expr = src.replace(/\^/g, '**').trim();
  if (!expr) throw new Error('Empty');
  const f = new Function('x', 'y', `with (Math) { return (${expr}); }`);
  if (typeof f(0.5, 0.5) !== 'number') throw new Error('Not a number');
  return f;
}

function createSurface(src, scheme) {
  const f = buildFunction(src);
  const N = SEG + 1;
  const z = new Float32Array(N * N), ok = new Uint8Array(N * N);
  let minZ = Infinity, maxZ = -Infinity;

  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const x = (i / SEG - 0.5) * 2 * HALF, y = (j / SEG - 0.5) * 2 * HALF;
    let v; try { v = f(x, y); } catch (e) { v = NaN; }
    const k = i * N + j;
    if (typeof v === 'number' && isFinite(v) && Math.abs(v) < 1e4) {
      z[k] = v; ok[k] = 1;
      if (v < minZ) minZ = v; if (v > maxZ) maxZ = v;
    }
  }
  if (minZ === Infinity) throw new Error('No valid points');

  // Rescale height to fit the box (no clipping)
  const s = BOX / Math.max(Math.abs(minZ), Math.abs(maxZ), 1e-9);
  const pos = new Float32Array(N * N * 3), col = new Float32Array(N * N * 3);
  const cmap = colorSchemes[scheme];
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const k = i * N + j;
    const x = (i / SEG - 0.5) * 2 * HALF, y = (j / SEG - 0.5) * 2 * HALF;
    pos.set([x, ok[k] ? z[k] * s : 0, -y], k * 3);   // math z -> Three.js Y (up)
    const t = maxZ > minZ ? (z[k] - minZ) / (maxZ - minZ) : 0.5;
    const c = cmap(t); col.set([c.r, c.g, c.b], k * 3);
  }

  // Skip triangles touching invalid points (leaves holes)
  const idx = [];
  for (let i = 0; i < SEG; i++) for (let j = 0; j < SEG; j++) {
    const a = i * N + j, b = a + 1, c = a + N, d = c + 1;
    if (ok[a] && ok[b] && ok[c] && ok[d]) idx.push(a, b, d, a, d, c);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();

  const mesh = new THREE.Mesh(g, new THREE.MeshPhongMaterial({ vertexColors: true, side: THREE.DoubleSide, shininess: 60, specular: 0x333333 }));
  // Wireframe shares the same geometry (much lighter than WireframeGeometry)
  const wf = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.12 }));
  return { mesh, wf, minZ, maxZ };
}

// Grid & axes
const grid = new THREE.GridHelper(40, 40, 0x00ff8844, 0x00ff8822);
grid.position.y = -BOX; scene.add(grid);
scene.add(new THREE.AxesHelper(15));

// Pointer controls (mouse + touch)
let dragging = false, prev = { x: 0, y: 0 };
let rotation = { x: 0.5, y: 0.5 }, distance = 32;
const el = renderer.domElement;
el.style.touchAction = 'none';
el.style.display = 'block';
el.addEventListener('pointerdown', e => {
  dragging = true; prev = { x: e.clientX, y: e.clientY };
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointercancel', () => dragging = false);
window.addEventListener('blur', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  rotation.y -= (e.clientX - prev.x) * 0.005;
  rotation.x += (e.clientY - prev.y) * 0.005;
  rotation.x = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, rotation.x));
  prev = { x: e.clientX, y: e.clientY };
});
el.addEventListener('wheel', e => {
  e.preventDefault();
  distance = Math.max(10, Math.min(70, distance + e.deltaY * 0.05));
}, { passive: false });

function disposeSurface() {
  if (!surface) return;
  scene.remove(surface); scene.remove(wire);
  surface.geometry.dispose(); surface.material.dispose(); wire.material.dispose();
  surface = wire = null;
}

function plotFunction() {
  const src = document.getElementById('function-input').value;
  const scheme = document.getElementById('color-scheme').value;
  const err = document.getElementById('error-msg');
  try {
    const r = createSurface(src, scheme);
    clearInterval(scaleTimer);
    disposeSurface();
    surface = r.mesh; wire = r.wf;
    scene.add(surface); scene.add(wire);
    err.classList.remove('show');
    document.getElementById('range').textContent = `z range: ${r.minZ.toPrecision(4)} → ${r.maxZ.toPrecision(4)}`;

    let sc = 0.1; surface.scale.setScalar(sc); wire.scale.setScalar(sc);
    scaleTimer = setInterval(() => {
      sc = Math.min(1, sc + 0.05);
      surface.scale.setScalar(sc); wire.scale.setScalar(sc);
      if (sc >= 1) clearInterval(scaleTimer);
    }, 16);
  } catch (e) {
    err.classList.add('show');
    console.error(e);
  }
}

document.getElementById('plot-btn').addEventListener('click', plotFunction);
document.getElementById('color-scheme').addEventListener('change', plotFunction);
document.getElementById('function-input').addEventListener('keydown', e => { if (e.key === 'Enter') plotFunction(); });
document.querySelectorAll('.preset-btn').forEach(b => b.addEventListener('click', () => {
  document.getElementById('function-input').value = b.dataset.func;
  plotFunction();
}));

// Panel toggle
const toggleBtn = document.getElementById('toggle-panel'), panel = document.getElementById('control-panel');
let open = true;
toggleBtn.addEventListener('click', () => {
  open = !open;
  panel.classList.toggle('collapsed', !open);
  toggleBtn.classList.toggle('panel-open', open);
  toggleBtn.firstElementChild.textContent = open ? '✕' : '☰';
});

function animate() {
  requestAnimationFrame(animate);
  if (!dragging && surface) rotation.y += 0.001;
  camera.position.set(
    distance * Math.sin(rotation.y) * Math.cos(rotation.x),
    distance * Math.sin(rotation.x),
    distance * Math.cos(rotation.y) * Math.cos(rotation.x));
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

plotFunction();
animate();
</script>
</body>
</html>
